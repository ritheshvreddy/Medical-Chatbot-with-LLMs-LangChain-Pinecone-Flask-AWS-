<!DOCTYPE html>
<html>
<head>
    <title>Medical Chatbot - {{ model_name }}</title>

    <link href="//maxcdn.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css" rel="stylesheet">
    <script src="//maxcdn.bootstrapcdn.com/bootstrap/4.1.1/js/bootstrap.min.js"></script>
    <script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>

    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}"/>
</head>

<body>
    <div class="container-fluid h-100">
        <div class="row justify-content-center h-100">
            <div class="col-md-8 col-xl-6 chat">
                <div class="card">

                    <!-- Dynamic Header Color -->
                    <div class="card-header msg_head"
                        style="background-color: {% if 'Gemini' in model_name %}#DB4437{% else %}#2c3e50{% endif %};">
                        <div class="d-flex bd-highlight">
                            <div class="img_cont">
                                <img src="https://i.ibb.co/fSNP7Rz/icons8-chatgpt-512.png" class="rounded-circle user_img">
                                <span class="online_icon"></span>
                            </div>
                            <div class="user_info">
                                <span>{{ model_name }}</span>
                                <p>Ask me anything!</p>
                            </div>
                        </div>
                    </div>

                    <div id="messageFormeight" class="card-body msg_card_body"></div>

                    <div class="card-footer">
                        <form id="messageArea" class="input-group">
                            <input type="text" id="text" name="msg" placeholder="Type your message..."
                                autocomplete="off" class="form-control type_msg" required/>
                            <div class="input-group-append">
                                <button type="submit" id="send" class="input-group-text send_btn">
                                    <i class="fas fa-location-arrow"></i>
                                </button>
                            </div>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>

<script>
$(document).ready(function() {

    // 🔥 ALWAYS POST TO /ask
    var endpoint_url = "/ask";

    $("#messageArea").on("submit", function(event) {
        event.preventDefault();

        const date = new Date();
        const str_time = date.getHours() + ":" + date.getMinutes();
        var rawText = $("#text").val();

        var userHtml = `
        <div class="d-flex justify-content-end mb-4">
            <div class="msg_cotainer_send">${rawText}
                <span class="msg_time_send">${str_time}</span>
            </div>
        </div>`;
        
        $("#text").val("");
        $("#messageFormeight").append(userHtml);

        // Typing indicator
        var loadingHtml = `
        <div id="loading" class="d-flex justify-content-start mb-4">
            <div class="msg_cotainer">...</div>
        </div>`;

        $("#messageFormeight").append(loadingHtml);

        $.ajax({
            data: { msg: rawText },
            type: "POST",
            url: endpoint_url,
        }).done(function(data) {
            $("#loading").remove();

            var botHtml = `
            <div class="d-flex justify-content-start mb-4">
                <div class="msg_cotainer">${data}
                    <span class="msg_time">${str_time}</span>
                </div>
            </div>`;
            
            $("#messageFormeight").append(botHtml);
        });
    });
});
</script>

</body>
</html>
