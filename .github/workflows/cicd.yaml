name: Deploy Application Docker Image to EC2 instance

on:
  push:
    branches:
      - main

env:
  IMAGE_TAG: latest

jobs:
  Continuous-Integration:
    name: Build & Push Docker Image to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPO }}:${{ env.IMAGE_TAG }} .

      - name: Push Docker image to ECR
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPO }}:${{ env.IMAGE_TAG }}

  Continuous-Deployment:
    name: Deploy Docker Image to EC2
    needs: Continuous-Integration
    runs-on: self-hosted

    steps:
      - name: Configure AWS credentials (EC2 runner)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR (EC2)
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Stop and remove existing container
        run: |
          docker stop medical-chatbot || true
          docker rm -f medical-chatbot || true

      - name: Clean up unused Docker images and volumes
        run: docker system prune -af

      - name: Pull latest Docker image from ECR
        run: |
          docker pull \
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPO }}:${{ env.IMAGE_TAG }}

      - name: Run Docker container with correct environment variables
        run: |
          docker run -d \
            --name medical-chatbot \
            --restart unless-stopped \
            -p 5000:5000 \
            -e PORT=5000 \
            -e PINECONE_API_KEY=${{ secrets.PINECONE_API_KEY }} \
            -e GROQ_API_KEY=${{ secrets.GROQ_API_KEY }} \
            -e GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} \
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPO }}:${{ env.IMAGE_TAG }}